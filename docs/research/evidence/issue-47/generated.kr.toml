# Generated by kr init. Review decisions before running tests.
# Pool devices: KrSample-Verify-<N>. Configure isolation before UI tests.
# All configuration: kr skill --reference config

[gates.default]
scenarios = ["smoke"]
suites = ["unit"]

[project]
configuration = "Debug"
generate = "xcodegen generate --quiet"
name = "KrSample"
platforms = ["iOS"]
scheme = "KrSample"
xcodeproj = "KrSample.xcodeproj"

[scenarios.smoke]
only = ["KrSampleUITests"]

[simulators]
runtime = "iOS 27.1"

[simulators.devices.default]
count = 1
device_type = "iPhone Duo"

[suites.unit]
destination = "simulator"
only = ["KrSampleTests"]
scheme = "KrSample"
type = "test"
