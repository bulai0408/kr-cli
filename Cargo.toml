[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/bulai0408/kr-cli"

[workspace.dependencies]
kr-config = { path = "crates/kr-config" }
kr-events = { path = "crates/kr-events" }
kr-exec = { path = "crates/kr-exec" }
kr-machine = { path = "crates/kr-machine" }
kr-resource = { path = "crates/kr-resource" }
kr-sim = { path = "crates/kr-sim" }
kr-xcode = { path = "crates/kr-xcode" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
miette = { version = "7.6", features = ["fancy"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

assert_cmd = "2.2"
insta = { version = "1.49", features = ["json", "filters"] }
predicates = "3"
tempfile = "3"
