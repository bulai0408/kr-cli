# 第 6 批人工影响表的模块覆盖声明；Favorites 仅经 TitleDetail 间接依赖。
[project]
name = "Krill"
scheme = "KrillPlayerControls"
xcodeproj = "Krill.xcodeproj"
platforms = ["iOS"]
[simulators]
runtime = "iOS 18.6"
[simulators.devices.default]
device_type = "iPhone 16 Pro"
[modules.TitleDetail]
paths = ["Krill/TitleDetail", "Krill/Detail"]
depends_on = ["Metadata", "Sources", "Modules"]
[modules.Favorites]
paths = ["Krill/Favorites"]
depends_on = ["TitleDetail", "Domain", "UserState"]

[scenarios.ratings]
only = ["KrillUITests/Replay_ratings"]
modules = ["Domain", "Library", "Metadata", "Modules", "Sources", "UserState"]

[scenarios.module-watchlist]
only = ["KrillUITests/Replay_module_watchlist"]
modules = ["Domain", "UserState"]

[scenarios.official-tmdb]
only = ["KrillUITests/Replay_official_tmdb"]
modules = ["Domain", "Metadata", "Modules", "UserState"]

[scenarios.library-groups]
