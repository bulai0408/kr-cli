modules = ["Domain", "Library", "Metadata", "Modules", "Sources", "UserState"]

[scenarios.my-stats]
only = ["KrillUITests/Replay_my_stats"]
modules = ["Domain", "Player", "UserState"]

[scenarios.player-controls]
only = ["KrillUITests/Replay_player_controls"]
